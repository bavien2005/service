# Application name
quarkus.application.name=cart-service

# Server port
quarkus.http.port=8088

# Database config
quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/cart_service?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
quarkus.datasource.username=${DB_USER:nguyenbavien}
quarkus.datasource.password=${DB_PASS:nguyenbavien}

# Hibernate ORM
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=true
quarkus.hibernate-orm.dialect=org.hibernate.dialect.MySQLDialect
quarkus.hibernate-orm.jdbc.timezone=Asia/Ho_Chi_Minh

# Jackson config
quarkus.jackson.timezone=Asia/Ho_Chi_Minh
quarkus.jackson.fail-on-unknown-properties=false

# CORS - t?t hoàn toàn gi?ng Spring c?
quarkus.http.cors.enabled=false

# N?u mu?n b?t cho FE sau này thì ??i thành:
# quarkus.http.cors.enabled=true
# quarkus.http.cors.origins=http://localhost:5173
# quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
# quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# External services
product.service.url=http://localhost:8086/api/product
cloud.service.url=http://localhost:8081/api/cloud

# Quarkus REST Client config
quarkus.rest-client.product-service.url=${product.service.url}
quarkus.rest-client.cloud-service.url=${cloud.service.url}

# Logging
quarkus.log.level=INFO
quarkus.log.category."org.anta.cart_service".level=DEBUG
quarkus.log.category."org.hibernate.SQL".level=DEBUG
quarkus.log.category."org.hibernate.orm.jdbc.bind".level=TRACE
quarkus.log.category."io.quarkus.rest".level=DEBUG