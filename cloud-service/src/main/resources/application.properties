# ===============================
# APPLICATION
# ===============================
quarkus.application.name=cloud-service
quarkus.http.port=8081

# ===============================
# DATABASE
# ===============================
quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/cloud_service?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
quarkus.datasource.username=${DB_USER:nguyenbavien}
quarkus.datasource.password=${DB_PASS:nguyenbavien}

# ===============================
# HIBERNATE ORM
# ===============================
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=true
quarkus.hibernate-orm.dialect=org.hibernate.dialect.MySQLDialect
quarkus.hibernate-orm.jdbc.timezone=Asia/Ho_Chi_Minh

# ===============================
# JACKSON
# ===============================
quarkus.jackson.timezone=Asia/Ho_Chi_Minh
quarkus.jackson.fail-on-unknown-properties=false

# ===============================
# MULTIPART / UPLOAD LIMIT
# ===============================
quarkus.http.limits.max-body-size=200M
quarkus.http.body.handle-file-uploads=true
quarkus.http.body.delete-uploaded-files-on-end=true

