# ===============================
# APP
# ===============================
quarkus.application.name=identity-service
quarkus.http.port=8082

# ===============================
# MYSQL
# Spring c?:
# spring.datasource.url=${DB_URL}
# spring.datasource.username=${DB_USER}
# spring.datasource.password=${DB_PASS}
# ===============================
quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/identity_service?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
quarkus.datasource.username=${DB_USER:nguyenbavien}
quarkus.datasource.password=${DB_PASS:nguyenbavien}

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.jdbc.timezone=Asia/Ho_Chi_Minh

# ===============================
# JSON TIMEZONE
# ===============================
quarkus.jackson.timezone=Asia/Ho_Chi_Minh

# ===============================
# REDIS
# ===============================
redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}
redis.password=${REDIS_PASS:no-password}
redis.timeout=${REDIS_TIMEOUT:60000}

# ===============================
# CORS
# N?u ?i qua gateway thì gateway x? lý CORS.
# B?t thêm ? identity ?? test tr?c ti?p c?ng ???c.
# ===============================
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=Accept,Authorization,Content-Type,Origin,X-Requested-With
quarkus.http.cors.exposed-headers=Authorization,X-User-Name,X-User-Role,Location
quarkus.http.cors.access-control-allow-credentials=true

# ===============================
# LOG
# ===============================
quarkus.log.category."org.hibernate.SQL".level=DEBUG